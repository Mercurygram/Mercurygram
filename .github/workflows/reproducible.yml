name: Reproducible build check

# Heavy (full native + 2x fdroidserver build) — manual trigger only, not on
# every push. Run before tagging a release, or after touching build.gradle,
# native code, or bundled assets. Mirrors F-Droid's real reproducible-build
# verification (scripts/check-reproducibility.sh).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'determinism (build ref twice) | verify (vs f-droid.org or GitHub release APK)'
        type: choice
        options: [determinism, verify]
        default: determinism
      arg:
        description: 'determinism: git ref (blank=checked-out) — verify: versionCode OR GitHub APK URL'
        type: string
        default: ''
      arg2:
        description: 'verify with URL only: optional git ref (defaults to checked-out commit)'
        type: string
        default: ''

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both APKs always run in parallel. plugin.tor is soft-fail
  # (continue-on-error) until metadata/it.belloworld.mercurygram.plugin.tor.yml
  # is merged into fdroiddata. Once the recipe lands, drop the
  # continue-on-error expression.
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    continue-on-error: ${{ matrix.app == 'plugin.tor' }}

    strategy:
      fail-fast: false
      matrix:
        app: [main, plugin.tor]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run reproducibility check (real fdroidserver, podman) — ${{ matrix.app }}
        env:
          ARG: ${{ inputs.arg }}
          ARG2: ${{ inputs.arg2 }}
        run: |
          set -euo pipefail
          arg=$(printf '%s' "$ARG" | xargs)        # trim whitespace
          arg2=$(printf '%s' "$ARG2" | xargs)
          case "${{ inputs.mode }}" in
            verify) scripts/check-reproducibility.sh --app=${{ matrix.app }} verify "$arg" "$arg2" ;;
            *)      scripts/check-reproducibility.sh --app=${{ matrix.app }} determinism "$arg" ;;
          esac
