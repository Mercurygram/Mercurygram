name: Instrumentation tests

on:
  push:
    branches: [Mercurygram]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prewarm-native:
    uses: ./.github/workflows/_prewarm-native.yml
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_HASH: ${{ secrets.APP_HASH }}

  instrumentation:
    runs-on: ubuntu-24.04
    needs: prewarm-native
    if: ${{ !cancelled() }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        # Same pinned set as _prewarm-native.yml: nasm for dav1d x86/x86_64
        # SIMD assembly; cmake is queried by the jni-cache-fingerprint
        # composite.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gperf meson libuv1-dev nasm cmake

      - name: Compute JNI cache fingerprint
        uses: ./.github/actions/jni-cache-fingerprint

      - name: Restore JNI native caches (x86_64 — emulator ABI)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        with:
          path: |
            TMessagesProj/jni/boringssl/build
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/dav1d/build
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/td/build
            TMessagesProj/jni/td/td/generate/auto
            TMessagesProj/jni/td/tdutils/generate/auto
          key: jni-native-Linux-x86_64-ndk-${{ hashFiles('.jni-cache-fingerprint') }}
          restore-keys: |
            jni-native-Linux-x86_64-

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Cache AVD
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-v1

      - name: Warm AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot warmed"

      - name: Run instrumentation tests
        id: run_tests
        # Don't fail the job on gradle's non-zero exit — `Gate on failure
        # count` below is the authoritative pass/fail signal. Lets us
        # tolerate the upstream-defect baseline (KNOWN_FAILURES) while
        # still catching any NEW regression.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # MG_BUILD_TAG: TMessagesProj_App applies mg-version.gradle which
          # mandates the property at configure-time even when we only assemble
          # :TMessagesProj_AppTests (root configures all modules). Synthetic
          # pre-stable placeholder is fine — test APK never ships.
          # Single line: reactivecircus/android-emulator-runner splits the
          # `script:` input on newlines and runs each as a separate command —
          # bash `\` line continuation is NOT honored.
          script: ./gradlew :TMessagesProj_AppTests:connectedAfatDebugAndroidTest -PMG_BUILD_TAG=12.7.3.99.0 --no-daemon --stacktrace

      - name: Gate on failure count
        # Upstream kotlinfixture+classgraph+jvm-driver chain doesn't init on
        # Android ART → 39 polymorphic-resolution fixtures fail with
        # ExceptionInInitializerError / ClassNotFoundException. They're
        # pre-existing in upstream (DrKLO never runs this module in CI).
        # Bump KNOWN_FAILURES only after confirming the new fail is the
        # same root cause.
        env:
          KNOWN_FAILURES: 39
        run: |
          set -euo pipefail
          # `find -print0` + xargs handles AGP's space-containing dir names
          # (`emulator-5554 - 11/`). Bash `**` is off by default and globstar
          # wouldn't traverse those names safely anyway.
          mapfile -d '' xmls < <(find TMessagesProj_AppTests/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -print0)
          if [ ${#xmls[@]} -eq 0 ]; then
            echo "::error::No JUnit XML produced — test run never reached the assertion phase."
            exit 1
          fi
          fails=$(grep -hoE 'failures="[0-9]+"' "${xmls[@]}" | grep -oE '[0-9]+' | paste -sd+ | bc)
          errs=$(grep -hoE 'errors="[0-9]+"'    "${xmls[@]}" | grep -oE '[0-9]+' | paste -sd+ | bc)
          tests=$(grep -hoE 'tests="[0-9]+"'    "${xmls[@]}" | grep -oE '[0-9]+' | paste -sd+ | bc)
          total=$((fails + errs))
          echo "tests=$tests failures=$fails errors=$errs total=$total baseline=$KNOWN_FAILURES"
          if [ "$total" -gt "$KNOWN_FAILURES" ]; then
            echo "::error::Regression: $total failures > baseline $KNOWN_FAILURES."
            exit 1
          fi
          if [ "$total" -lt "$KNOWN_FAILURES" ]; then
            echo "::warning::Failures dropped to $total < baseline $KNOWN_FAILURES — lower KNOWN_FAILURES."
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: |
            TMessagesProj_AppTests/build/reports/androidTests/
            TMessagesProj_AppTests/build/outputs/androidTest-results/
