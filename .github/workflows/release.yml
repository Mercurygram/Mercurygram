name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: afatFdArm32
            task: assembleAfatFdArm32Release
            abi: armeabi-v7a
          - flavor: afatFdArm64
            task: assembleAfatFdArm64Release
            abi: arm64-v8a
          - flavor: afatFdX86
            task: assembleAfatFdX86Release
            abi: x86
          - flavor: afatFdX86_64
            task: assembleAfatFdX86_64Release
            abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go gperf g++ libuv1 libuv1-dev make meson nasm ninja-build

      - name: Install NDK and build-tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;35.0.0"

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew ${{ matrix.task }} \
            -PRELEASE_STORE_PASSWORD="$KS_PASS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_KEY_ALIAS" \
            --no-daemon

      - name: Rename artifact
        id: rename
        run: |
          MG_VERSION_NAME=$(grep '^MG_VERSION_NAME=' gradle.properties | cut -d= -f2)
          APK_DIR=TMessagesProj_App/build/outputs/apk/${{ matrix.flavor }}/release
          DEST="$APK_DIR/Mercurygram-${MG_VERSION_NAME}-${{ matrix.abi }}.apk"
          cp "$APK_DIR/${{ matrix.flavor }}.apk" "$DEST"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ steps.rename.outputs.apk_path }}

  changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag -l '[0-9]*' --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -A1 "^${GITHUB_REF_NAME}$" | tail -1)

          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ] || [ -z "$PREV_TAG" ]; then
            bash .github/scripts/changelog-diff.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/diff.txt"
          else
            bash .github/scripts/changelog-diff.sh "$PREV_TAG" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/diff.txt"
          fi

          DIFF=$(cat "$RUNNER_TEMP/diff.txt")
          SYSTEM=$(cat .github/scripts/changelog-prompt.md)
          BODY=$(curl -sL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://models.github.ai/inference/chat/completions \
            -d "$(jq -n --arg sys "$SYSTEM" --arg diff "$DIFF" '{
              model: "openai/gpt-4.1-mini",
              messages: [
                {role: "system", content: $sys},
                {role: "user", content: $diff}
              ]
            }')" | jq -r '.choices[0].message.content // empty')

          if [ -z "$BODY" ]; then
            # Fallback: format current [MG] feature lines as bullets
            BODY=$(grep -A100 '=== CURRENT FEATURES ===' "$RUNNER_TEMP/diff.txt" \
              | grep '^\[MG\]' | sed 's/^\[MG\] /- /' || echo "- See commit history for changes.")
          fi

          echo "$BODY" > "$RUNNER_TEMP/changelog.md"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.md

  release:
    runs-on: ubuntu-24.04
    needs: [build, changelog]
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts/

      - name: Download changelog artifact
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/changelog.md
          files: artifacts/*.apk
