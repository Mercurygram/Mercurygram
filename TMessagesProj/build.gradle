//return an api key from a properties file.
def getAppId() {
    Properties properties = new Properties()
    properties.load(new FileInputStream("./API_KEYS"))
    return properties.get("APP_ID")
}
def getAppHash() {
    Properties properties = new Properties()
    properties.load(new FileInputStream("./API_KEYS"))
    return "\"" + properties.get("APP_HASH") + "\""
}

// If all requested tasks target the same single F-Droid per-ABI flavor, return that ABI
// so the library's CMake build can be limited to just that ABI. Returns null otherwise
// (fat builds, local development, multiple ABIs requested).
// Note: flavors are matched longest-first so AfatFdX86_64 is matched before AfatFdX86.
def detectSingleFdAbi() {
    def fdFlavorToAbi = [
        'AfatFdArm64'  : 'arm64-v8a',
        'AfatFdArm32'  : 'armeabi-v7a',
        'AfatFdX86_64' : 'x86_64',
        'AfatFdX86'    : 'x86',
    ]
    def detectedAbis = [] as Set
    gradle.startParameter.taskNames.each { taskName ->
        // Match longest flavor name first to avoid AfatFdX86 matching inside AfatFdX86_64.
        def matched = fdFlavorToAbi.sort { -it.key.length() }.find { flavor, _ ->
            taskName.contains(flavor)
        }
        if (matched) detectedAbis << matched.value
    }
    return detectedAbis.size() == 1 ? detectedAbis.first() : null
}
def singleFdAbi = detectSingleFdAbi()

def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        // Limit CMake to a single ABI for per-ABI F-Droid builds; has no effect otherwise.
        if (singleFdAbi) ndk.abiFilters singleFdAbi

        externalNativeBuild {
            cmake {
                version '3.10.2'
                def cmakeArgs = ['-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24'] //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                if (getProps('QUIET_NATIVE_BUILD')) {
                    cmakeArgs += '-DQUIET_BUILD=ON'
                }
                arguments(*cmakeArgs)
            }
        }

        buildConfigField "int", "APP_ID", getAppId()
        buildConfigField "String", "APP_HASH", getAppHash()
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "0"
        }

        standalone {
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'

    buildFeatures {
        aidl = true
    }
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

// Shared first step: init submodules and apply source-tree patches (idempotent).
// All per-ABI tasks depend on this so patches are applied exactly once.
task patchNativeSources {
    description = 'Init native submodules and apply source patches.'
    doLast {
        exec {
            workingDir rootDir
            commandLine 'git', 'submodule', 'update', '--init',
                'TMessagesProj/jni/libvpx',
                'TMessagesProj/jni/ffmpeg',
                'TMessagesProj/jni/dav1d',
                'TMessagesProj/jni/boringssl',
                'TMessagesProj/jni/td',
                'TMessagesProj/jni/whisper'
        }
        def ndkDir = android.ndkDirectory.toString()
        def ninjaPath = System.getenv('NINJA_PATH') ?: 'ninja'
        for (script in ['patch_boringssl.sh', 'patch_td.sh']) {
            exec {
                workingDir "${projectDir}/jni"
                environment 'NDK', ndkDir
                environment 'NINJA_PATH', ninjaPath
                commandLine 'bash', script
            }
        }
    }
}

// Mapping from Android ABI name to the short name used by libvpx/ffmpeg/boringssl scripts.
def androidToScriptAbi = [
    'arm64-v8a'   : 'arm64',
    'armeabi-v7a' : 'arm',
    'x86_64'      : 'x86_64',
    'x86'         : 'x86',
]

// Register one build task per ABI. Each task compiles only for its ABI.
// Scripts that accept positional ABI args (libvpx, ffmpeg, boringssl) receive the
// short internal name; dav1d, patch_ffmpeg, tde2e use the Android ABI name directly.
['buildNativeLibsArm64'  : ['arm64-v8a'],
 'buildNativeLibsArm32'  : ['armeabi-v7a'],
 'buildNativeLibsX86_64' : ['x86_64'],
 'buildNativeLibsX86'    : ['x86'],
].each { taskName, androidAbis ->
    tasks.register(taskName) {
        description = "Build native libraries for ${androidAbis}."
        dependsOn patchNativeSources
        doLast {
            def ndkDir = android.ndkDirectory.toString()
            def ninjaPath = System.getenv('NINJA_PATH') ?: 'ninja'
            def quietBuild = getProps('QUIET_NATIVE_BUILD') ? '1' : '0'
            def scriptAbis = androidAbis.collect { androidToScriptAbi[it] ?: it }
            [['build_libvpx_clang.sh', scriptAbis],
             ['build_dav1d.sh',        androidAbis],
             ['build_ffmpeg_clang.sh', scriptAbis],
             ['patch_ffmpeg.sh',       androidAbis],
             ['build_boringssl.sh',    scriptAbis],
             ['build_tde2e.sh',        androidAbis],
            ].each { script, abis ->
                exec {
                    workingDir "${projectDir}/jni"
                    environment 'NDK', ndkDir
                    environment 'NINJA_PATH', ninjaPath
                    environment 'QUIET_BUILD', quietBuild
                    commandLine(['bash', script] + abis)
                }
            }
        }
    }
}

// Ensure sequential execution when all 4 per-ABI tasks run together (fat builds),
// avoiding races in patch scripts that write shared source files.
tasks.named('buildNativeLibsArm32').configure  { mustRunAfter 'buildNativeLibsArm64'  }
tasks.named('buildNativeLibsX86_64').configure { mustRunAfter 'buildNativeLibsArm32'  }
tasks.named('buildNativeLibsX86').configure    { mustRunAfter 'buildNativeLibsX86_64' }

// Combined task for fat/bundle builds (all 4 ABIs).
task buildNativeLibs(description: 'Build native libraries for all ABIs.') {
    dependsOn 'buildNativeLibsArm64', 'buildNativeLibsArm32',
              'buildNativeLibsX86_64', 'buildNativeLibsX86'
}

// Wire each CMake/JniLibFolders task to the matching per-ABI native build task.
// CMake task names include the ABI in brackets, e.g. configureCMakeRelease[arm64-v8a].
// merge*JniLibFolders tasks use mustRunAfter (not dependsOn) for each per-ABI task:
// jniLibs.srcDirs points to jni/ but contributes no .so files (no ABI-named subdirs
// exist there); the ordering only prevents a race where a concurrent native build
// creates/deletes intermediate files (.d, .o) while the merge task walks the tree.
// mustRunAfter is sufficient — native builds are scheduled by CMake task dependencies.
afterEvaluate {
    def abiToTask = [
        'arm64-v8a'   : 'buildNativeLibsArm64',
        'armeabi-v7a' : 'buildNativeLibsArm32',
        'x86_64'      : 'buildNativeLibsX86_64',
        'x86'         : 'buildNativeLibsX86',
    ]
    def fallbackTask = singleFdAbi ? abiToTask[singleFdAbi] : 'buildNativeLibs'
    tasks.matching {
        it.name.matches('configureCMake.*') ||
            it.name.matches('buildCMake.*') ||
            it.name.matches('externalNativeBuild.*')
    }.configureEach { task ->
        def matched = abiToTask.find { abi, _ -> task.name.contains(abi) }
        task.dependsOn tasks.named(matched ? matched.value : fallbackTask)
    }
    tasks.matching { it.name.matches('merge.*JniLibFolders') }.configureEach { mergeTask ->
        abiToTask.each { _, nativeTaskName ->
            mergeTask.mustRunAfter(tasks.named(nativeTaskName))
        }
    }
}
